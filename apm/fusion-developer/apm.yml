name: fusion-developer
version: "1.6.1"
description: Shared Fusion developer workflow toolkit for GitHub Copilot
author: Equinor Fusion
license: MIT
targets:
  - copilot
dependencies:
  apm:
    - git: equinor/fusion-skills
      path: skills/.system/fusion-research
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/.experimental/fusion-mcp
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/.system/fusion-code-conventions
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/fusion-devtools
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/fusion-skills
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/fusion-issue-authoring
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/.experimental/fusion-issue-solving
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/.experimental/fusion-issue-task-planning
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/.experimental/fusion-dependency-review
      ref: v1.6.1 # release-managed
    - git: equinor/fusion-skills
      path: skills/.experimental/fusion-github-review-resolution
      ref: v1.6.1 # release-managed
  mcp:
    - name: fusion-mcp
      registry: false
      transport: http
      url: https://mcp.api.fusion.equinor.com/mcp
      extra:
        oauth:
          clientId: fe06d016-0e42-452e-a3d7-f08325037122
