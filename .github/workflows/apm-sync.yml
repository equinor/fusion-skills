name: APM Sync

on:
  workflow_call:
    inputs:
      apm-version:
        description: APM CLI version used for the update
        required: false
        type: string
        default: "0.29.0"
      pr-branch:
        description: Branch used for the update pull request
        required: false
        type: string
        default: chore/apm-sync

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync APM dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update APM dependencies
        uses: microsoft/apm-action@v1
        with:
          apm-version: ${{ inputs.apm-version }}
          update: "true"

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ inputs.pr-branch }}
          delete-branch: true
          commit-message: "chore(apm): sync dependencies"
          title: "chore(apm): sync dependencies"
          body: |
            Automated APM dependency sync.

            APM refreshed dependencies within the constraints in `apm.yml`,
            updated `apm.lock.yaml`, and redeployed managed agent context.
            Review the complete diff before merging.
